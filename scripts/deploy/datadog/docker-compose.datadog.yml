# Datadog Agent sidecar for FOKS server telemetry.
#
# Receives OTLP metrics + traces from the foks-server containers (their
# config's telemetry.otlp_endpoint = "datadog-agent:4317") and adds host,
# container and Postgres (Database Monitoring) metrics. It also ships the
# foks-server and Postgres container logs (see the privacy note).
#
# Loaded alongside docker-compose.yml and docker-compose.override.yml via
# COMPOSE_FILE in the workdir's .env; see scripts/deploy/README.md,
# "Telemetry (Datadog)". Needs in .env: DD_API_KEY, DD_SITE, DD_PG_PASSWORD.
#
# Privacy: STAGING-ONLY EXCEPTION (decided 2026-11-11). Container logs are
# shipped RAW. foks-server logs carry UIDs, team IDs, usernames and client
# IPs, and Postgres error DETAIL lines can echo row values. That's accepted
# for staging only (docs/observability.md, "Privacy rule"). Before reusing
# this file in prod, either set DD_LOGS_ENABLED to "false" or add
# log_processing_rules (mask_sequences) to every com.datadoghq.ad.logs label.

services:
  datadog-agent:
    # Pinned: the agent runs with the Docker socket (root-equivalent, see
    # below), so upgrades should be deliberate, not whatever 7.x was pushed
    # last. To upgrade, bump this and redeploy.
    image: gcr.io/datadoghq/agent:7.85.3
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      # Must match telemetry.env in the servers' local.pre.libsonnet, which
      # tags the foks.* OTLP data; otherwise Datadog splits host/DB metrics
      # and app metrics under different env values.
      DD_ENV: ${DD_ENV:-staging}
      DD_HOSTNAME: ${DD_HOSTNAME:-foks-staging}
      # OTLP intake from the foks-server containers on the compose network.
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT: "0.0.0.0:4317"
      DD_OTLP_CONFIG_LOGS_ENABLED: "false"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      # Logs: staging only, raw; see the privacy note above. Only containers
      # with a com.datadoghq.ad.logs label are collected, so the agent's own
      # logs and any new, unlabelled container stay on the host.
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"
      # Tail the json-file logs from disk (mounted below), not the Docker API.
      DD_LOGS_CONFIG_DOCKER_CONTAINER_USE_FILE: "true"
      # Off to save CPU/RAM on a small host; container metrics stay on.
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "false"
      # Read by the Postgres check below via %%env_DD_PG_PASSWORD%%.
      DD_PG_PASSWORD: ${DD_PG_PASSWORD:?set DD_PG_PASSWORD in .env}
    volumes:
      # SECURITY: root-equivalent. ":ro" only protects the socket file; the
      # agent can still use the whole Docker API (e.g. start a privileged
      # container). Accepted for the staging canary, for label-based
      # autodiscovery and per-container metrics. Before prod, revisit: a
      # GET-only docker-socket-proxy (still exposes container env vars, i.e.
      # secrets) or no socket with a static postgres.d/conf.yaml.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      # Log collection: container log files, plus the agent's tail positions
      # so a restart neither re-sends nor skips lines.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /opt/datadog-agent/run:/opt/datadog-agent/run:rw
    # The staging host is small (2 vCPU / 2 GB); keep the agent from
    # competing with the server under benchmark load.
    # Datadog's documented Docker setup. The agent's OTLP collector looks up
    # its own PID in /host/proc, which fails in a private PID namespace
    # ("failed to register process metrics: process does not exist"), and
    # container metrics need the host cgroup namespace on cgroup v2.
    pid: host
    cgroup: host
    mem_limit: 512m
    cpus: 0.5
    # Not published on the host: only compose-network peers can send.
    expose:
      - "4317"

  postgresql:
    labels:
      # Log lines start with a timestamp; anything else (DETAIL, STATEMENT,
      # HINT continuations) joins the previous event.
      com.datadoghq.ad.logs: >-
        [{"source": "postgresql", "service": "postgresql",
          "log_processing_rules": [{"type": "multi_line", "name": "new_log",
            "pattern": "\\d{4}-\\d{2}-\\d{2} "}]}]
      # Datadog autodiscovery: Postgres integration + Database Monitoring
      # across every foks_* database. Query samples are obfuscated by the
      # agent; parameters are never collected (all server SQL uses $n).
      com.datadoghq.ad.checks: >-
        {"postgres": {"init_config": {}, "instances": [{
          "dbm": true,
          "host": "%%host%%", "port": 5432,
          "username": "datadog", "password": "%%env_DD_PG_PASSWORD%%",
          "dbname": "postgres",
          "database_autodiscovery": {"enabled": true, "include": ["^foks_"]},
          "relations": [{"relation_regex": ".*", "schemas": ["public"]}],
          "collect_settings": {"enabled": true},
          "collect_schemas": {"enabled": false}
        }]}}

  # Log collection for the foks-server containers. `service` matches the
  # OTel service.name (foks-<server type>; compose service names are the
  # server types), so logs, APM and foks.* metrics line up per service.
  # zap writes JSON, which Datadog parses: `level` becomes the status and
  # `msg` the message. A service listed here must exist in
  # docker-compose.yml, or compose fails with "has neither an image nor a
  # build context"; a service missing from here just doesn't ship logs.
  autocert:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-autocert"}]'
  internal_ca:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-internal_ca"}]'
  kv_store:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-kv_store"}]'
  merkle_batcher:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-merkle_batcher"}]'
  merkle_builder:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-merkle_builder"}]'
  merkle_query:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-merkle_query"}]'
  merkle_signer:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-merkle_signer"}]'
  probe:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-probe"}]'
  queue:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-queue"}]'
  realtime:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-realtime"}]'
  reg:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-reg"}]'
  user:
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "foks-user"}]'
