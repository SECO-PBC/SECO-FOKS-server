name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Packages to lint + test. client/ is back in: the API drift that made it
      # untypecheckable after the first upstream merge is reconciled, and it is
      # where most of this fork's own changes live, so leaving it out meant our
      # own work was the only code CI never checked.
      #
      GO_PKGS: "./server/... ./lib/... ./proto/... ./conf/... ./tools/... ./play/... ./client/..."
      # Linted with everything else, but TESTED in its own steps below: these
      # bring up containers, and a unit-test failure should report in seconds
      # rather than behind several minutes of that.
      LINT_PKGS: "./server/... ./lib/... ./proto/... ./conf/... ./tools/... ./play/... ./client/... ./integration-tests/..."
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make libpcsclite-dev pkg-config

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config --global user.email "ci@foks.test"
          git config --global user.name "FOKS CI"
          git config --global init.defaultBranch main

      - name: Lint (golangci-lint)
        run: go tool golangci-lint run $LINT_PKGS

      - name: Test (unit)
        run: go test $GO_PKGS -count=1

      # The integration suite brings up postgres itself, via testcontainers
      # against the runner's own docker daemon (integration-tests/common/
      # setup.go), so it needs no `services:` block -- only that nothing
      # excludes it, which until now something did. Fork CI compiled these
      # tests and never ran them, so the fork has merged integration tests
      # that never passed at all; making lib a gate is what stops that.
      - name: Test (integration, lib)
        run: go test ./integration-tests/lib/... -count=1 -timeout 20m

      # NOT a gate, deliberately. integration-tests/cli flakes on signup and
      # provisioning (TestSignupAndSwitch, TestYubiProvision, TestSelfProvision,
      # TestTeamLoaderPermissions) for reasons unrelated to any change under
      # review -- upstream sees the same failures on its own PRs and merges
      # through them. Running it keeps the output visible; gating on it would
      # spend the merge signal on a known flake. Promote it once that is fixed.
      - name: Test (integration, cli -- advisory)
        continue-on-error: true
        run: go test ./integration-tests/cli/... -count=1 -timeout 20m
